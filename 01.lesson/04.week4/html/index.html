<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>はじめてのHTML入門 | すぱるたブログ</title>
    <meta
      name="description"
      content="HTMLの基本構造を、ブログ記事のよくある構成を例に解説します。"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ページ上部：サイト名やナビゲーション -->
    <header>
      <p>すぱるたブログ</p>
      <nav>
        <ul>
          <li><a href="/">ホーム</a></li>
          <li><a href="/about.html">このブログについて</a></li>
        </ul>
      </nav>
    </header>

    <!-- ページの主要な中身。ページに1つだけ -->
    <main>
      <article>
        <h1 id="page-title">はじめてのHTML入門</h1>
        <p class="post-date">
          <small
            >公開日: <time datetime="2026-07-12">2026年7月12日</time></small
          >
        </p>
        >

        <img src="cover.jpg" alt="ノートPCでHTMLを書いている様子" />

        <h2>HTMLとは何か</h2>
        <p>HTMLはWebページの「骨組み」を書く言語です。</p>

        <h2>まず覚えるタグ</h2>
        <p>見出し・段落・リンク・画像から始めましょう。</p>

        <ul>
          <li>見出し … <code>&lt;h1&gt;</code>〜<code>&lt;h6&gt;</code></li>
          <li>段落 … <code>&lt;p&gt;</code></li>
          <li>リンク … <code>&lt;a&gt;</code></li>
        </ul>
      </article>
    </main>

    <!-- ページ下部：コピーライトなど -->
    <footer>
      <p><small>&copy; 2026 すぱるたブログ</small></p>
    </footer>
