<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux Story Quest</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="quest-app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">$</span>
        <div>
          <p class="eyebrow">Linux Story Quest</p>
          <h1>コマンドで街をひらく</h1>
        </div>
      </div>

      <div class="progress-wrap" aria-label="進行状況">
        <div id="progressDots" class="progress-dots"></div>
        <p id="progressText" class="progress-text">1 / 36</p>
      </div>

      <div class="top-actions">
        <button id="bookButton" class="icon-button" type="button" aria-label="コマンド一覧" title="コマンド一覧">?</button>
        <button id="resetButton" class="icon-button reset" type="button" aria-label="最初から" title="最初から">↻</button>
      </div>
    </header>

    <section class="stage-layout" aria-label="Linux学習ゲーム">
      <section class="scene-panel">
        <div id="scene" class="scene action-idle">
          <div class="sun" aria-hidden="true"></div>
          <div class="cloud cloud-a" aria-hidden="true"></div>
          <div class="cloud cloud-b" aria-hidden="true"></div>

          <div class="place home active" data-place="home">
            <span class="place-icon">⌂</span>
            <span>ホーム</span>
          </div>
          <div class="place docs" data-place="docs">
            <span class="place-icon">□</span>
            <span>資料室</span>
          </div>
          <div class="place atelier" data-place="atelier">
            <span class="place-icon">◇</span>
            <span>作業部屋</span>
          </div>
          <div class="path-line path-home-docs" aria-hidden="true"></div>
          <div class="path-line path-home-atelier" aria-hidden="true"></div>

          <div id="objectShelf" class="object-shelf" aria-hidden="true">
            <span class="object file">guide.txt</span>
            <span class="object folder">docs/</span>
            <span class="object log">logs/</span>
            <span class="object script">scripts/</span>
            <span class="object config">config/</span>
          </div>

          <div id="folderBuild" class="folder-build" aria-hidden="true">
            <div class="folder-tab"></div>
            <div class="folder-body"></div>
            <span>atelier</span>
          </div>

          <div id="noteBuild" class="note-build" aria-hidden="true">
            <span></span>
            <span></span>
            <strong>idea.txt</strong>
          </div>

          <div id="searchBeam" class="search-beam" aria-hidden="true"></div>

          <div id="avatar" class="avatar" data-place="home" aria-hidden="true">
            <div class="hair"></div>
            <div class="face">
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="smile"></span>
            </div>
            <div class="body">
              <span class="scarf"></span>
              <span class="arm left"></span>
              <span class="arm right"></span>
            </div>
            <div class="legs">
              <span></span>
              <span></span>
            </div>
          </div>

          <div class="story-bubble">
            <p id="storyLine">まずは自分がどこにいるか知ろう。</p>
          </div>
        </div>

        <div class="result-card" aria-live="polite">
          <p class="result-label">実行結果</p>
          <pre id="resultOutput">ここにコマンドの結果が表示されます。</pre>
        </div>
      </section>

      <aside class="mission-card">
        <p id="stageLabel" class="eyebrow">Step 1</p>
        <h2 id="stageTitle">現在地を知る</h2>
        <p id="stageText" class="stage-text"></p>

        <div class="command-focus">
          <span>今日のコマンド</span>
          <strong id="focusCommand">pwd</strong>
          <p id="focusMeaning">今いる場所を表示する。</p>
        </div>

        <div class="goal-box">
          <p>やること</p>
          <strong id="goalText">pwd を入力する</strong>
        </div>

        <div class="helper-row">
          <button id="hintButton" class="soft-button" type="button">ヒント</button>
          <button id="fillButton" class="soft-button primary" type="button">答えを見る</button>
        </div>
      </aside>
    </section>

    <section class="command-dock" aria-label="コマンド入力">
      <div class="chips" id="commandChips"></div>
      <form id="commandForm" class="command-form" autocomplete="off">
        <label for="commandInput">ミナに指示</label>
        <input id="commandInput" type="text" spellcheck="false" placeholder="ここにコマンドを入力">
        <button type="submit">実行</button>
      </form>
      <p id="feedbackLine" class="feedback-line">コマンドを入れると、ミナがその動きをして街が進みます。</p>
    </section>
  </main>

  <dialog id="bookDialog" class="book-dialog">
    <div class="book-head">
      <div>
        <p class="eyebrow">Command Book</p>
        <h2>このゲームで覚えるコマンド</h2>
      </div>
      <button id="closeBook" class="icon-button" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="bookList" class="book-list"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
