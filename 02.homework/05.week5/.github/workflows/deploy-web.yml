name: Deploy web

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Upload versioned assets
        run: >-
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/ --delete
          --exclude "index.html" --exclude "site.webmanifest"
          --exclude "*.png" --exclude "*.svg"
          --cache-control "public, max-age=3600"
      - name: Upload entry documents
        run: |
          aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html --cache-control "no-cache, must-revalidate" --content-type "text/html; charset=utf-8"
          aws s3 cp dist/site.webmanifest s3://${{ vars.S3_BUCKET }}/site.webmanifest --cache-control "no-cache, must-revalidate" --content-type "application/manifest+json"
      - name: Upload icons
        run: >-
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/
          --exclude "*" --include "*.png" --include "*.svg"
          --cache-control "public, max-age=86400"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
