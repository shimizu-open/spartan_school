<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#eef1f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#262b2c" media="(prefers-color-scheme: dark)">
    <meta name="description" content="価値を決めずに、心が動いた一片をとっておく場所">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="./site.webmanifest">
    <link rel="stylesheet" href="./assets/styles.css">
    <link rel="stylesheet" href="./assets/fonts.css">
    <title>かけら</title>
  </head>
  <body class="min-h-dvh overflow-x-hidden bg-sushi font-gothic text-sumi antialiased">
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-5 focus:top-3 focus:z-50 focus:inline-flex focus:min-h-11 focus:items-center focus:bg-men focus:px-5 focus:py-3 focus:text-ai focus-visible:outline-2 focus-visible:outline-ai focus-visible:outline-offset-2">本文へ</a>
    <div id="app" class="flex min-h-dvh flex-col">
      <header class="shrink-0 border-b border-kei px-5 py-3 sm:px-8">
        <div class="mx-auto flex max-w-content-md items-center gap-3 sm:max-w-content md:max-w-content-md">
          <div class="flex items-center gap-3">
            <span aria-hidden="true" class="shard-sm block size-5 bg-ai"></span>
            <p class="font-mincho text-base tracking-logo text-sumi">かけら</p>
          </div>
        </div>
      </header>

      <main id="main" class="mx-auto flex w-full max-w-content-md flex-1 flex-col justify-center px-5 pb-20 pt-5 sm:max-w-content sm:px-8 md:max-w-content-md md:px-0 md:pt-7 short:justify-start short:pb-3 short:pt-3">
        <section id="today-view" aria-labelledby="today-title"></section>
        <section id="outing-view" aria-labelledby="outing-title" hidden></section>
        <section id="fragments-view" aria-labelledby="fragments-title" hidden></section>
        <section id="about-view" aria-labelledby="about-title" hidden></section>
      </main>

      <div id="onboarding-view"></div>
      <div id="status" class="sr-only" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./assets/app/main.js"></script>
  </body>
</html>
