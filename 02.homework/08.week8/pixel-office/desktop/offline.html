<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Pixel Office - 接続できません</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #1d1f2b;
        color: #fff;
        font-family: system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      }
      .card {
        background: #fff;
        color: #23253a;
        border-radius: 16px;
        padding: 28px 32px;
        max-width: 420px;
        text-align: center;
      }
      code {
        display: block;
        margin: 12px 0;
        padding: 8px;
        background: #f1f2f6;
        border-radius: 8px;
        word-break: break-all;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 10px 20px;
        border: 0;
        border-radius: 10px;
        background: #5468ff;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 style="font-size: 20px">サーバーに接続できません</h1>
      <p>ネットワークとサーバーの起動状態を確認してください。</p>
      <code id="url"></code>
      <p style="font-size: 13px; color: #5d6180">接続先はメニューの「ファイル &gt; サーバー設定を開く」で変更できます。</p>
      <button id="retry">再試行</button>
    </div>
    <script>
      const url = new URLSearchParams(location.search).get('url') || '';
      document.getElementById('url').textContent = url;
      document.getElementById('retry').addEventListener('click', () => {
        if (/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:/])/.test(url)) location.href = url;
      });
    </script>
  </body>
</html>
