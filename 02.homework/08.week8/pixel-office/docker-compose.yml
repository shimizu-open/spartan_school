# Local run:              docker compose up --build        -> http://localhost:3000
# With a TURN server:     docker compose -f docker-compose.yml -f docker-compose.turn.yml up --build
#
# On AWS (EC2) the same file is used; see docs/DEPLOY_AWS.md.

services:
  app:
    build: .
    image: pixel-office:latest
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # 1 when behind CloudFront / a load balancer
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      # STUN servers (JSON). TURN: addresses + shared secret (temporary passwords per person)
      ICE_SERVERS: "${ICE_SERVERS:-}"
      TURN_URLS: "${TURN_URLS:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      # Secret header CloudFront adds; requests without it are refused (see docs/DEPLOY_AWS.md)
      ORIGIN_SECRET: "${ORIGIN_SECRET:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      # Spaces are saved in /data. Delete spaces unused for N days (0 = keep forever)
      SPACE_RETENTION_DAYS: "${SPACE_RETENTION_DAYS:-0}"
      # Limits that protect the disk (anyone with the URL can create a space)
      MAX_STORED_SPACES: "${MAX_STORED_SPACES:-1000}"
      MAX_TOTAL_STORAGE_MB: "${MAX_TOTAL_STORAGE_MB:-10240}"
    volumes:
      - pixel-data:/data
    restart: unless-stopped
    # Hardening: read-only filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pixel-data:
